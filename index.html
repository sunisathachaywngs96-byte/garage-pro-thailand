<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto Expert - Firebase</title>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- ================= FIREBASE SDK ================= -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  deleteDoc,
  doc,
  query,
  orderBy,
  serverTimestamp,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "garage-system.firebaseapp.com",
  projectId: "garage-system",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

window._fb = {
  db,
  auth,
  collection,
  addDoc,
  getDocs,
  deleteDoc,
  doc,
  query,
  orderBy,
  serverTimestamp,
  onSnapshot,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  signOut,
  onAuthStateChanged
};

window.dispatchEvent(new Event("firebase-ready"));
</script>

<style>
/* ====== MINIMAL UI (ใช้ของเดิมคุณได้) ====== */
body { font-family: IBM Plex Sans Thai; background:#0d1117; color:#fff; margin:0; }

#authScreen { display:flex; align-items:center; justify-content:center; height:100vh; }

.hidden { display:none; }

.main { display:none; padding:20px; }
.sidebar { display:none; }

.repair-item, .alert-item { padding:10px; border:1px solid #333; margin:8px 0; border-radius:8px; }
</style>
</head>

<body>

<!-- ================= AUTH ================= -->
<div id="authScreen">
  <div>
    <input id="authEmail" placeholder="email">
    <input id="authPass" type="password" placeholder="password">

    <button onclick="handleAuth()">Login / Register</button>
    <div id="authErr"></div>
  </div>
</div>

<!-- ================= APP ================= -->
<div class="sidebar" id="sidebar"></div>

<div class="main" id="mainApp">

  <h2>🚗 Auto Expert</h2>

  <div>
    <h3 id="carModel">-</h3>
    <div id="carMileage">0 กม.</div>
  </div>

  <hr>

  <h3>🔧 Repairs</h3>
  <div id="repairList"></div>

  <h3>🔔 Alerts</h3>
  <div id="alertList"></div>

</div>

<script>

/* ================= STATE ================= */
let currentUser = null;
let selectedCarId = null;
let currentMileage = 0;

/* ================= AUTH FLOW ================= */
window.addEventListener("firebase-ready", () => {

  const { auth, onAuthStateChanged } = window._fb;

  onAuthStateChanged(auth, async (user) => {

    if (!user) {
      document.getElementById("authScreen").style.display = "flex";
      document.getElementById("mainApp").style.display = "none";
      return;
    }

    currentUser = user;

    document.getElementById("authScreen").style.display = "none";
    document.getElementById("mainApp").style.display = "block";

    await loadCars();
    loadRepairsRealtime();
    loadAlertsRealtime();

  });

});


/* ================= AUTH ACTION ================= */
async function handleAuth() {

  const fb = window._fb;

  const email = document.getElementById("authEmail").value;
  const pass = document.getElementById("authPass").value;

  try {

    await fb.signInWithEmailAndPassword(fb.auth, email, pass);

  } catch {

    await fb.createUserWithEmailAndPassword(fb.auth, email, pass);

  }
}


/* ================= LOAD CARS ================= */
async function loadCars() {

  const fb = window._fb;

  const snap = await fb.getDocs(
    fb.collection(fb.db, "users", currentUser.uid, "cars")
  );

  if (snap.empty) return;

  const car = snap.docs[0];

  selectedCarId = car.id;
  currentMileage = car.data().mileage || 0;

  document.getElementById("carModel").innerText =
    car.data().model || "Car";

  document.getElementById("carMileage").innerText =
    currentMileage.toLocaleString() + " กม.";
}


/* ================= REPAIRS (REALTIME) ================= */
function loadRepairsRealtime() {

  const fb = window._fb;

  const list = document.getElementById("repairList");

  const q = fb.query(
    fb.collection(fb.db, "users", currentUser.uid, "repairs"),
    fb.orderBy("createdAt", "desc")
  );

  fb.onSnapshot(q, (snap) => {

    list.innerHTML = "";

    snap.forEach(doc => {

      const d = doc.data();

      list.innerHTML += `
        <div class="repair-item">
          🔧 ${d.title} - ${d.price || 0} บาท
        </div>
      `;
    });

  });
}


/* ================= ALERTS (REALTIME) ================= */
function loadAlertsRealtime() {

  const fb = window._fb;

  const list = document.getElementById("alertList");

  const q = fb.query(
    fb.collection(fb.db, "users", currentUser.uid, "alerts"),
    fb.orderBy("createdAt", "desc")
  );

  fb.onSnapshot(q, (snap) => {

    list.innerHTML = "";

    snap.forEach(doc => {

      const a = doc.data();

      list.innerHTML += `
        <div class="alert-item">
          🔔 ${a.title} (${a.nextDue || 0} km)
        </div>
      `;
    });

  });
}


/* ================= SAVE REPAIR ================= */
async function saveRepair() {

  const fb = window._fb;

  await fb.addDoc(
    fb.collection(fb.db, "users", currentUser.uid, "repairs"),
    {
      title: "Test Repair",
      price: 100,
      createdAt: fb.serverTimestamp()
    }
  );

}

</script>

</body>
</html>
