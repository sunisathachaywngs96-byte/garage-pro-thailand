<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Auto Expert PRO</title>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>

<style>
:root{
  --bg:#0d1117;--card:#1c2230;--card2:#222940;--green:#22c55e;
  --text:#f0f6fc;--muted:#8b949e;--border:#30363d;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:"IBM Plex Sans Thai",sans-serif;}
body{background:var(--bg);color:var(--text);display:flex;min-height:100vh}

/* LOGIN */
#auth{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:10}
.box{background:var(--card);padding:30px;border-radius:16px;width:350px;border:1px solid var(--border)}
input{width:100%;padding:10px;margin:6px 0;background:var(--card2);border:1px solid var(--border);color:#fff;border-radius:8px}
button{width:100%;padding:10px;background:var(--green);border:none;font-weight:700;border-radius:8px;cursor:pointer}

/* SIDEBAR */
aside{width:220px;background:var(--card);padding:20px;border-right:1px solid var(--border)}
main{flex:1;padding:20px}

/* CARDS */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{background:var(--card);padding:15px;border-radius:12px;border:1px solid var(--border)}
.big{font-size:22px;font-weight:700}

/* LIST */
.item{padding:10px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between}
small{color:var(--muted)}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="auth">
  <div class="box">
    <h2>Auto Expert PRO</h2>
    <input id="email" placeholder="email">
    <input id="pass" type="password" placeholder="password">
    <button onclick="login()">Login / Register</button>
  </div>
</div>

<!-- APP -->
<aside id="app" style="display:none">
  <h3>🚗 Auto Expert</h3>
  <br>
  <button onclick="logout()">Logout</button>
</aside>

<main id="main" style="display:none">

  <!-- DASHBOARD -->
  <div class="grid">
    <div class="card">
      <div>จำนวนรายการ</div>
      <div class="big" id="count">0</div>
    </div>
    <div class="card">
      <div>ค่าใช้จ่ายรวม</div>
      <div class="big" id="total">0</div>
    </div>
    <div class="card">
      <div>แจ้งเตือน</div>
      <div class="big" id="alert">0</div>
    </div>
  </div>

  <br>

  <!-- ADD -->
  <div class="card">
    <input id="title" placeholder="รายการซ่อม">
    <input id="price" placeholder="ราคา">
    <input id="km" placeholder="เลขไมล์">
    <button onclick="addRepair()">+ เพิ่ม</button>
  </div>

  <br>

  <!-- LIST -->
  <div class="card">
    <h3>รายการซ่อม</h3>
    <div id="list"></div>
  </div>

</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, addDoc, deleteDoc, doc,
  query, orderBy, onSnapshot, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDAfm7eDJPFiWrUK_U0aqS7yl2Wt_PpjmA",
  authDomain: "garage-system-41587.firebaseapp.com",
  projectId: "garage-system-41587",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let user = null;

/* AUTH */
window.login = async () => {
  const email = emailEl.value;
  const pass = passEl.value;

  try {
    user = (await signInWithEmailAndPassword(auth,email,pass)).user;
  } catch {
    user = (await createUserWithEmailAndPassword(auth,email,pass)).user;
  }
};

/* LOGOUT */
window.logout = () => signOut(auth);

/* REPAIR ADD */
window.addRepair = async () => {
  await addDoc(collection(db,"users",user.uid,"repairs"),{
    title:title.value,
    price:Number(price.value),
    km:Number(km.value),
    createdAt:serverTimestamp()
  });
  title.value="";price.value="";km.value="";
};

/* DELETE */
window.del = async (id)=>{
  await deleteDoc(doc(db,"users",user.uid,"repairs",id));
};

/* REALTIME */
function load(){
  const q = query(collection(db,"users",user.uid,"repairs"),orderBy("createdAt","desc"));

  onSnapshot(q,(snap)=>{
    list.innerHTML="";
    let total=0;

    snap.forEach(d=>{
      const x=d.data();
      total+=Number(x.price||0);

      list.innerHTML+=`
        <div class="item">
          <div>
            <b>${x.title}</b><br>
            <small>${x.km} km</small>
          </div>
          <div>
            ฿${x.price}
            <button onclick="del('${d.id}')">x</button>
          </div>
        </div>
      `;
    });

    count.innerText=snap.size;
    totalEl.innerText=total;

    // ALERT LOGIC
    alert.innerText = snap.size > 5 ? "⚠️ Service due" : "OK";
  });
}

/* AUTH STATE */
onAuthStateChanged(auth,(u)=>{
  if(u){
    user=u;
    auth.style.display="none";
    app.style.display="block";
    main.style.display="block";
    load();
  }
});

/* ELEMENTS */
const emailEl=document.getElementById("email");
const passEl=document.getElementById("pass");
const list=document.getElementById("list");
const count=document.getElementById("count");
const totalEl=document.getElementById("total");
const alert=document.getElementById("alert");
</script>

</body>
</html>
