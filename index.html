<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auto Expert - Firebase</title>
</head>
<body>

  <h2 id="status">⏳ กำลังเชื่อมต่อ Firebase...</h2>
  <p id="user">ยังไม่ได้ Login</p>

  <!--
    ════════════════════════════════════════════════
    วิธีใช้งาน Firebase ใน HTML ไฟล์เดียว
    ใช้ type="module" + import จาก CDN ของ Firebase
    ════════════════════════════════════════════════
  -->
  <script type="module">

    // ── 1. Import Firebase SDK จาก CDN ──────────────────────────────
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import { getAnalytics }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";

    import {
      getAuth,
      onAuthStateChanged,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import {
      getFirestore,
      collection,
      doc,
      addDoc,
      setDoc,
      getDoc,
      getDocs,
      deleteDoc,
      query,
      orderBy,
      where,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    // ── 2. Firebase Config (copy มาจาก Firebase Console) ───────────
    const firebaseConfig = {
      apiKey:            "AIzaSyDAfm7eDJPFiWrUK_U0aqS7yl2Wt_PpjmA",
      authDomain:        "garage-system-41587.firebaseapp.com",
      projectId:         "garage-system-41587",
      storageBucket:     "garage-system-41587.firebasestorage.app",
      messagingSenderId: "688480145767",
      appId:             "1:688480145767:web:9bfba3df045ca434d91fc2",
      measurementId:     "G-30329DLNXE"
    };


    // ── 3. Initialize Firebase ───────────────────────────────────────
    const app       = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);       // Google Analytics
    const auth      = getAuth(app);            // Authentication
    const db        = getFirestore(app);       // Firestore Database


    // ── 4. ตรวจสอบสถานะ Firebase เชื่อมต่อสำเร็จ ──────────────────
    document.getElementById('status').textContent = '✅ Firebase เชื่อมต่อสำเร็จ!';
    console.log('✅ Firebase initialized:', app.name);


    // ── 5. ตรวจสอบสถานะ Login ────────────────────────────────────────
    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('user').textContent =
          `✅ Login แล้ว: ${user.email} (uid: ${user.uid})`;
        console.log('User logged in:', user);
      } else {
        document.getElementById('user').textContent = '🔒 ยังไม่ได้ Login';
        console.log('No user logged in');
      }
    });


    // ══════════════════════════════════════════════════════════════════
    //  ตัวอย่างฟังก์ชันที่ใช้ได้ทันที (ก็อปไปใช้ในโปรเจกต์ได้เลย)
    // ══════════════════════════════════════════════════════════════════

    // ── Auth: สมัครสมาชิก ────────────────────────────────────────────
    async function register(email, password) {
      try {
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        console.log('Registered:', cred.user.email);
        return cred.user;
      } catch (e) {
        console.error('Register error:', e.code, e.message);
        throw e;
      }
    }

    // ── Auth: เข้าสู่ระบบ ────────────────────────────────────────────
    async function login(email, password) {
      try {
        const cred = await signInWithEmailAndPassword(auth, email, password);
        console.log('Logged in:', cred.user.email);
        return cred.user;
      } catch (e) {
        console.error('Login error:', e.code, e.message);
        throw e;
      }
    }

    // ── Auth: ออกจากระบบ ─────────────────────────────────────────────
    async function logout() {
      await signOut(auth);
      console.log('Logged out');
    }

    // ── Firestore: เพิ่มข้อมูล ──────────────────────────────────────
    async function addData(collectionName, data) {
      const ref = await addDoc(collection(db, collectionName), {
        ...data,
        createdAt: serverTimestamp()
      });
      console.log('Added doc id:', ref.id);
      return ref.id;
    }

    // ── Firestore: อ่านข้อมูลทั้งหมด ────────────────────────────────
    async function getData(collectionName) {
      const snap = await getDocs(collection(db, collectionName));
      return snap.docs.map(d => ({ id: d.id, ...d.data() }));
    }

    // ── Firestore: แก้ไขข้อมูล ──────────────────────────────────────
    async function updateData(collectionName, docId, data) {
      await setDoc(doc(db, collectionName, docId), {
        ...data,
        updatedAt: serverTimestamp()
      }, { merge: true });
      console.log('Updated:', docId);
    }

    // ── Firestore: ลบข้อมูล ─────────────────────────────────────────
    async function deleteData(collectionName, docId) {
      await deleteDoc(doc(db, collectionName, docId));
      console.log('Deleted:', docId);
    }

    // ── Firestore: Query ข้อมูลแบบมีเงื่อนไข ───────────────────────
    async function queryData(collectionName, fieldName, value) {
      const q = query(
        collection(db, collectionName),
        where(fieldName, '==', value),
        orderBy('createdAt', 'desc')
      );
      const snap = await getDocs(q);
      return snap.docs.map(d => ({ id: d.id, ...d.data() }));
    }


    // ── Expose ฟังก์ชันให้ใช้งานจาก HTML ───────────────────────────
    // (ถ้าต้องการเรียกจาก onclick="..." ใน HTML ต้อง expose ผ่าน window)
    window.fbAuth   = { register, login, logout };
    window.fbDB     = { addData, getData, updateData, deleteData, queryData };
    window.fbApp    = app;
    window.fbDb     = db;

    // ── ตัวอย่างโครงสร้าง Firestore สำหรับ Auto Expert ────────────
    //
    //  users/{uid}                    → ข้อมูลผู้ใช้
    //  users/{uid}/cars/{carId}       → รถแต่ละคัน
    //  users/{uid}/repairs/{repairId} → ประวัติการซ่อม
    //
    //  ตัวอย่าง เพิ่มรถ:
    //  await addDoc(collection(db, 'users', uid, 'cars'), { brand: 'Toyota', model: 'Altis', ... })
    //
    //  ตัวอย่าง อ่านประวัติซ่อมของรถ:
    //  await getDocs(query(collection(db,'users',uid,'repairs'), where('carId','==',carId)))

  </script>

</body>
</html>
